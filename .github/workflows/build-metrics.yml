name: build-metrics

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: build-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BASELINE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
      COMPILE_TIME_REGRESSION_PCT: 15
      BUILD_DIR_SIZE_REGRESSION_PCT: 10
      BINARY_SIZE_REGRESSION_PCT: 10

    steps:
      - uses: actions/checkout@v6
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build time

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes

      - name: Install local version of FIMS
        run: remotes::install_local(upgrade = "always", force = TRUE)
        shell: Rscript {0}

      - name: Setup for gtest
        run: FIMS:::setup_gtest()
        shell: Rscript {0}

      - name: Configure
        run: cmake -S . -B build -DBUILD_DOC=OFF -G Ninja -DCMAKE_CXX_FLAGS="--coverage -ftime-report -ftemplate-backtrace-limit=0"

      # /usr/bin/time -v is Linux only
      # on macOS use /usr/bin/time -l, on Windows remove the prefix entirely
      - name: Build and capture metrics
        run: |
          set -o pipefail
          /usr/bin/time -v cmake --build build --parallel 16 2>&1 | tee build.log

      - name: Capture binary sizes
        run: |
          set -euo pipefail
          echo "=== Binary and object file sizes ===" >> build.log
          find build/ \( -name "*.so" -o -name "*.o" -o -name "*.a" \) -type f -printf "%p\t%s\n" | sort > binary_sizes.tsv
          cat binary_sizes.tsv >> build.log
          echo "=== du summary of build directory ===" >> build.log
          du -sh build/ >> build.log
          du -sb build/ | awk '{print $1}' > build_dir_size_bytes.txt

      - name: Parse metrics
        run: |
          set -euo pipefail

          # wall clock time, converts m:ss or h:mm:ss to seconds
          RAW_TIME=$(grep "Elapsed (wall clock) time" build.log | grep -oP '[\d:]+\.?\d*$' || echo "")
          if [ -n "$RAW_TIME" ]; then
            WALL=$(echo "$RAW_TIME" | awk -F: '{
              if (NF == 3) print ($1*3600 + $2*60 + $3)
              else if (NF == 2) print ($1*60 + $2)
              else print $1
            }')
            WALL=$(printf "%.2f" "$WALL")
          else
            WALL="null"
          fi

          # peak RAM, kbytes to MB
          RAW_RAM=$(grep "Maximum resident set size" build.log | grep -oP '\d+$' || echo "")
          if [ -n "$RAW_RAM" ]; then
            RAM=$(echo "$RAW_RAM" | awk '{printf "%.2f", $1/1024}')
          else
            RAM="null"
          fi

          # warning and error counts
          WARNINGS=$(grep -c "warning:" build.log || true)
          ERRORS=$(grep -v "[0-9]* error(s)* generated" build.log | grep -c "error:" || true)

          # template instantiation time, summing the wall column from all TOTAL lines
          # TOTAL line columns: 1=TOTAL 2=: 3=usr 4=sys 5=wall 6=GGC
          TEMPLATE=$(awk '/^ *TOTAL *:/ {sum += $5} END {printf "%.2f", sum}' build.log)
          [ "$TEMPLATE" = "0.00" ] && TEMPLATE="null"

          BUILD_DIR_SIZE_BYTES=$(cat build_dir_size_bytes.txt)

          # binary sizes as a JSON object in bytes
          BINARY_JSON=$(python3 <<EOF
          import json

          result = {}
          with open('binary_sizes.tsv') as f:
              for line in f:
                  path, size = line.rstrip('\n').split('\t')
                  result[path] = int(size)

          print(json.dumps(result, sort_keys=True))
          EOF
          )

          BINARY_TOTAL_BYTES=$(python3 <<EOF
          import json

          binary_sizes = json.loads('''$BINARY_JSON''')
          print(sum(binary_sizes.values()))
          EOF
          )

          COMMIT="${GITHUB_SHA:-unknown}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg commit "$COMMIT" \
            --arg ts "$TIMESTAMP" \
            --argjson wall "$WALL" \
            --argjson ram "$RAM" \
            --argjson warnings "$WARNINGS" \
            --argjson errors "$ERRORS" \
            --argjson template "$TEMPLATE" \
            --argjson binary "$BINARY_JSON" \
            --argjson build_dir_size_bytes "$BUILD_DIR_SIZE_BYTES" \
            --argjson binary_total_bytes "$BINARY_TOTAL_BYTES" \
            '{
              commit_sha: $commit,
              timestamp: $ts,
              wall_clock_time_sec: $wall,
              peak_ram_mb: $ram,
              warning_count: $warnings,
              error_count: $errors,
              template_time_sec: $template,
              build_dir_size_bytes: $build_dir_size_bytes,
              binary_total_bytes: $binary_total_bytes,
              binary_sizes: $binary
            }' > metrics.json

          echo "metrics.json written:"
          cat metrics.json

      - name: Download latest main metrics artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Looking for baseline metrics in $BASELINE_REPOSITORY."

          BASELINE_RUN_IDS=$(gh run list \
            --repo "$BASELINE_REPOSITORY" \
            --workflow build-metrics.yml \
            --branch main \
            --event push \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')

          if [ -z "$BASELINE_RUN_IDS" ]; then
            echo "No successful main push run found for baseline metrics."
            exit 0
          fi

          for BASELINE_RUN_ID in $BASELINE_RUN_IDS; do
            echo "Checking main push run $BASELINE_RUN_ID for build-metrics-main artifact."
            rm -rf baseline-metrics
            mkdir -p baseline-metrics

            if gh run download "$BASELINE_RUN_ID" \
              --repo "$BASELINE_REPOSITORY" \
              --name build-metrics-main \
              --dir baseline-metrics; then
              if [ -f baseline-metrics/metrics.json ]; then
                cp baseline-metrics/metrics.json previous_metrics.json
                echo "Downloaded baseline metrics from main push run $BASELINE_RUN_ID."
                break
              fi
              echo "Run $BASELINE_RUN_ID had the artifact but no metrics.json file."
            else
              echo "No build-metrics-main artifact found for main push run $BASELINE_RUN_ID."
            fi
          done

          if [ ! -f previous_metrics.json ]; then
            echo "No usable build-metrics-main artifact found in the last 20 successful main push runs."
          fi

      - name: Compare against previous metrics
        run: |
          REGRESSION=0

          if [ ! -f previous_metrics.json ]; then
            echo "No previous metrics found. This is the first run." > metrics_comparison.log
          else
            PREV_COMMIT=$(jq -r '.commit_sha' previous_metrics.json)
            CURR_COMMIT=$(jq -r '.commit_sha' metrics.json)
            PREV_WALL=$(jq -r '.wall_clock_time_sec // "null"' previous_metrics.json)
            CURR_WALL=$(jq -r '.wall_clock_time_sec // "null"' metrics.json)
            PREV_RAM=$(jq -r '.peak_ram_mb // "null"' previous_metrics.json)
            CURR_RAM=$(jq -r '.peak_ram_mb // "null"' metrics.json)
            PREV_WARN=$(jq -r '.warning_count' previous_metrics.json)
            CURR_WARN=$(jq -r '.warning_count' metrics.json)
            PREV_ERR=$(jq -r '.error_count' previous_metrics.json)
            CURR_ERR=$(jq -r '.error_count' metrics.json)
            PREV_TMPL=$(jq -r '.template_time_sec // "null"' previous_metrics.json)
            CURR_TMPL=$(jq -r '.template_time_sec // "null"' metrics.json)
            PREV_BUILD_DIR_SIZE=$(jq -r '.build_dir_size_bytes // "null"' previous_metrics.json)
            CURR_BUILD_DIR_SIZE=$(jq -r '.build_dir_size_bytes // "null"' metrics.json)
            PREV_BINARY_TOTAL=$(jq -r '.binary_total_bytes // "null"' previous_metrics.json)
            CURR_BINARY_TOTAL=$(jq -r '.binary_total_bytes // "null"' metrics.json)

            {
              echo "BUILD METRICS COMPARISON:"
              echo ""
              echo "Previous commit: $PREV_COMMIT"
              echo "Current commit: $CURR_COMMIT"
              echo ""

              if [ "$PREV_WALL" != "null" ] && [ "$CURR_WALL" != "null" ]; then
                WALL_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_WALL - $PREV_WALL) / $PREV_WALL) * 100}")
                echo "Wall clock time: ${CURR_WALL}s (was ${PREV_WALL}s, ${WALL_PCT}%)"
              else
                echo "Wall clock time: ${CURR_WALL}s (no previous data)"
              fi

              if [ "$PREV_RAM" != "null" ] && [ "$CURR_RAM" != "null" ]; then
                RAM_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_RAM - $PREV_RAM) / $PREV_RAM) * 100}")
                echo "Peak RAM: ${CURR_RAM}MB (was ${PREV_RAM}MB, ${RAM_PCT}%)"
              else
                echo "Peak RAM: ${CURR_RAM}MB (no previous data)"
              fi

              echo "Warnings: $CURR_WARN (was $PREV_WARN)"
              echo "Errors: $CURR_ERR (was $PREV_ERR)"

              if [ "$PREV_TMPL" != "null" ] && [ "$CURR_TMPL" != "null" ]; then
                TMPL_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_TMPL - $PREV_TMPL) / $PREV_TMPL) * 100}")
                echo "Template time: ${CURR_TMPL}s (was ${PREV_TMPL}s, ${TMPL_PCT}%)"
              else
                echo "Template time: ${CURR_TMPL}s (no previous data)"
              fi

              if [ "$PREV_BUILD_DIR_SIZE" != "null" ] && [ "$CURR_BUILD_DIR_SIZE" != "null" ]; then
                BUILD_DIR_SIZE_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_BUILD_DIR_SIZE - $PREV_BUILD_DIR_SIZE) / $PREV_BUILD_DIR_SIZE) * 100}")
                echo "Build directory size: ${CURR_BUILD_DIR_SIZE} bytes (was ${PREV_BUILD_DIR_SIZE} bytes, ${BUILD_DIR_SIZE_PCT}%)"
              else
                echo "Build directory size: ${CURR_BUILD_DIR_SIZE} bytes (no previous data)"
              fi

              if [ "$PREV_BINARY_TOTAL" != "null" ] && [ "$CURR_BINARY_TOTAL" != "null" ]; then
                BINARY_TOTAL_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_BINARY_TOTAL - $PREV_BINARY_TOTAL) / $PREV_BINARY_TOTAL) * 100}")
                echo "Binary/object total size: ${CURR_BINARY_TOTAL} bytes (was ${PREV_BINARY_TOTAL} bytes, ${BINARY_TOTAL_PCT}%)"
              else
                echo "Binary/object total size: ${CURR_BINARY_TOTAL} bytes (no previous data)"
              fi

              echo ""

              # regression checks
              REGRESSIONS=""

              if [ "$CURR_WARN" -gt "$PREV_WARN" ] 2>/dev/null; then
                REGRESSIONS="${REGRESSIONS}WARNING: warning count increased from $PREV_WARN to $CURR_WARN\n"
              fi

              if [ "$CURR_ERR" -gt "$PREV_ERR" ] 2>/dev/null; then
                REGRESSIONS="${REGRESSIONS}WARNING: error count increased from $PREV_ERR to $CURR_ERR\n"
              fi

              if [ "$PREV_WALL" != "null" ] && [ "$CURR_WALL" != "null" ]; then
                WALL_REGRESSED=$(awk "BEGIN {print (($CURR_WALL - $PREV_WALL) / $PREV_WALL * 100) > $COMPILE_TIME_REGRESSION_PCT ? 1 : 0}")
                if [ "$WALL_REGRESSED" = "1" ]; then
                  WALL_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_WALL - $PREV_WALL) / $PREV_WALL) * 100}")
                  REGRESSIONS="${REGRESSIONS}WARNING: compile time increased by ${WALL_PCT}% (threshold: ${COMPILE_TIME_REGRESSION_PCT}%)\n"
                fi
              fi

              if [ "$PREV_RAM" != "null" ] && [ "$CURR_RAM" != "null" ]; then
                RAM_REGRESSED=$(awk "BEGIN {print (($CURR_RAM - $PREV_RAM) / $PREV_RAM * 100) > 15 ? 1 : 0}")
                if [ "$RAM_REGRESSED" = "1" ]; then
                  RAM_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_RAM - $PREV_RAM) / $PREV_RAM) * 100}")
                  REGRESSIONS="${REGRESSIONS}WARNING: peak RAM increased by ${RAM_PCT}% (threshold: 15 percent)\n"
                fi
              fi

              if [ "$PREV_BUILD_DIR_SIZE" != "null" ] && [ "$CURR_BUILD_DIR_SIZE" != "null" ]; then
                BUILD_DIR_SIZE_REGRESSED=$(awk "BEGIN {print (($CURR_BUILD_DIR_SIZE - $PREV_BUILD_DIR_SIZE) / $PREV_BUILD_DIR_SIZE * 100) > $BUILD_DIR_SIZE_REGRESSION_PCT ? 1 : 0}")
                if [ "$BUILD_DIR_SIZE_REGRESSED" = "1" ]; then
                  BUILD_DIR_SIZE_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_BUILD_DIR_SIZE - $PREV_BUILD_DIR_SIZE) / $PREV_BUILD_DIR_SIZE) * 100}")
                  REGRESSIONS="${REGRESSIONS}WARNING: build directory size increased by ${BUILD_DIR_SIZE_PCT}% (threshold: ${BUILD_DIR_SIZE_REGRESSION_PCT}%)\n"
                fi
              fi

              if [ "$PREV_BINARY_TOTAL" != "null" ] && [ "$CURR_BINARY_TOTAL" != "null" ]; then
                BINARY_TOTAL_REGRESSED=$(awk "BEGIN {print (($CURR_BINARY_TOTAL - $PREV_BINARY_TOTAL) / $PREV_BINARY_TOTAL * 100) > $BINARY_SIZE_REGRESSION_PCT ? 1 : 0}")
                if [ "$BINARY_TOTAL_REGRESSED" = "1" ]; then
                  BINARY_TOTAL_PCT=$(awk "BEGIN {printf \"%.1f\", (($CURR_BINARY_TOTAL - $PREV_BINARY_TOTAL) / $PREV_BINARY_TOTAL) * 100}")
                  REGRESSIONS="${REGRESSIONS}WARNING: binary/object total size increased by ${BINARY_TOTAL_PCT}% (threshold: ${BINARY_SIZE_REGRESSION_PCT}%)\n"
                fi
              fi

              if [ -n "$REGRESSIONS" ]; then
                echo "REGRESSIONS DETECTED:"
                printf "$REGRESSIONS"
              else
                echo "No regressions detected."
              fi

            } > metrics_comparison.log

            if [ -n "$REGRESSIONS" ]; then
              REGRESSION=1
            fi
          fi

          cat metrics_comparison.log
          {
            echo "### Build metrics comparison"
            echo ""
            echo '```'
            cat metrics_comparison.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "REGRESSION=$REGRESSION" >> "$GITHUB_ENV"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-metrics-${{ github.sha }}
          path: |
            metrics.json
            build.log
            binary_sizes.tsv
            metrics_comparison.log
          retention-days: 90

      - name: Upload main baseline metrics artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-metrics-main
          path: |
            metrics.json
            build.log
            binary_sizes.tsv
            metrics_comparison.log
          retention-days: 90

      - name: Print metrics summary
        run: |
          cat metrics.json
          echo ""
          cat metrics_comparison.log

      - name: Fail on regression
        run: |
          if [ "$REGRESSION" = "1" ]; then
            echo "Build regression detected. See metrics_comparison.log for details."
            exit 1
          fi
